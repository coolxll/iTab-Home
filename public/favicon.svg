<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="50%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#818CF8" />
      <stop offset="100%" stopColor="#C084FC" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.85" />
      <stop offset="100%" stopColor="#6366F1" stopOpacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Inner glowing tab grid / modern window layers -->
  <g filter="url(#shadow)" transform="translate(40, 40)">
    <!-- Main Card -->
    <rect x="56" y="56" width="320" height="320" rx="72" fill="url(#glowGrad)" />
    
    <!-- Modern Grid Icon Tiles -->
    <rect x="96" y="96" width="96" height="96" rx="28" fill="#FFFFFF" opacity="0.95" />
    <rect x="240" y="96" width="96" height="96" rx="28" fill="#0F172A" opacity="0.9" />
    <rect x="96" y="240" width="96" height="96" rx="28" fill="#0F172A" opacity="0.9" />
    <rect x="240" y="240" width="96" height="96" rx="28" fill="#FFFFFF" opacity="0.95" />

    <!-- Center Glow Dot -->
    <circle cx="216" cy="216" r="16" fill="#38BDF8" />
  </g>
</svg>
