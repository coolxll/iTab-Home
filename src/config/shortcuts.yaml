# ==============================================================================
# iTab-Home 桌面图标与分类文件夹布局配置文件 (shortcuts.yaml)
# ==============================================================================
# 支持直接在 Git 中维护此文件，提交即可自动更新部署。
# 字段说明：
# - id: 唯一标识符
# - title: 显示名称
# - isFolder: 是否为文件夹 (true/false)
# - icon: 矢量图标名称 (如 chatgpt, claude, google, bilibili, github 等)
# - url: 点击跳转的外链地址
# - bgColor: 背景色或 Tailwind 样式
# - iconStyle: 可选覆盖 official (官方版) | optimized (优化版)
# - children: 当 isFolder 为 true 时，内部包含的子快捷图标列表
# ==============================================================================

version: 1

# Private defaults returned only by the authenticated /api/config endpoint.
settings:
  birthDate: '1988-03-04'
  city: 浦东新区
  wallpaper: /wallpapers/default.jpg
  wallpaperType: default
  searchEngineId: custom-search
  showRealWidgets: false
  iconStyle: official

